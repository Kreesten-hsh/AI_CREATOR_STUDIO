<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Ad Batch 03 • 05 Showcase 2 Outils Réels</title>
  <link rel="stylesheet" href="ads-bordeaux.css" />
  <style>
    .slide-05 {
      background: linear-gradient(180deg, #FAF5EE 0%, #EFE6DC 55%, #E9DFD3 100%);
    }
    .top-kicker {
      text-align: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: 0.06em;
      color: #B63131;
      text-transform: uppercase;
    }
    .show-title {
      text-align: center;
      font-family: var(--sans);
      font-weight: 800;
      font-size: 58px;
      line-height: 1.06;
      letter-spacing: -0.025em;
      color: #171313;
    }
    .show-serif {
      display: block;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: 72px;
      line-height: 1.02;
      color: #B63131;
      letter-spacing: -0.015em;
    }
    .phone-cap {
      text-align: center;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
      color: #171313;
    }
  </style>
</head>
<body>
  <div class="slide slide-05">
    <div class="L top-kicker" style="left:60px; top:56px; width:960px">
      ZÉRO CODE • CLAUDE GRATUIT
    </div>

    <h1 class="L show-title" style="left:60px; top:112px; width:960px">
      2 vrais outils créés
      <span class="show-serif">avec la même méthode.</span>
    </h1>

    <img
      class="L real-phone"
      src="assets/iphone-solde-dashboard.png"
      alt="Simulateur de Budget SOLDE. sur iPhone"
      style="left:118px; top:286px; width:356px; transform:rotate(-2deg)"
    />

    <img
      class="L real-phone"
      src="assets/iphone-calc.png"
      alt="Calculateur de Prix & Rentabilité sur iPhone haute définition"
      style="left:606px; top:286px; width:356px; transform:rotate(2deg)"
    />

    <div class="L phone-cap" style="left:86px; top:1058px; width:420px">
      Simulateur de Budget
    </div>

    <div class="L phone-cap" style="left:574px; top:1058px; width:420px">
      Calculateur de Prix (livré)
    </div>

    <div class="L cta-bordeaux" style="left:235px; top:1158px; width:610px">
      <span>Créer mon produit interactif</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </div>
  </div>
  <script src="../../carousels/check.js"></script>
</body>
</html>
