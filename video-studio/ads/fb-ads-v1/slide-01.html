<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Ad Batch 03 • 01 Vitrine Bordeaux</title>
  <link rel="stylesheet" href="ads-bordeaux.css" />
  <style>
    .slide-01 {
      background: radial-gradient(circle at 50% 28%, #FBF7F2 0%, #EFE6DC 100%);
    }
    .hero-title {
      text-align: center;
      font-family: var(--sans);
      font-weight: 800;
      font-size: 62px;
      line-height: 1.04;
      letter-spacing: -0.025em;
      color: #171313;
    }
    .hero-serif {
      display: block;
      margin-top: 2px;
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: 82px;
      line-height: 1.0;
      letter-spacing: -0.015em;
      color: #B63131;
    }
    .hero-sub {
      text-align: center;
      font-size: 29px;
      line-height: 1.32;
      font-weight: 500;
      color: #4A433E;
    }
    .badges-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }
  </style>
</head>
<body>
  <div class="slide slide-01">
    <h1 class="L hero-title" style="left:60px; top:60px; width:960px">
      Un produit digital
      <span class="hero-serif">qu'on utilise vraiment.</span>
    </h1>

    <p class="L hero-sub" style="left:84px; top:242px; width:912px">
      Transforme tes idées en vrai outil interactif, sans aucune compétence technique.
    </p>

    <div class="L badges-row" style="left:44px; top:352px; width:992px">
      <span class="relief-badge"><span class="relief-dot" aria-hidden="true"></span>Claude gratuit</span>
      <span class="relief-badge"><span class="relief-dot" aria-hidden="true"></span>Sans savoir coder</span>
      <span class="relief-badge"><span class="relief-dot" aria-hidden="true"></span>Créé en 1 soirée</span>
    </div>

    <div class="L macbook" style="left:44px; top:458px; width:824px">
      <div class="macbook-lid">
        <div class="macbook-cam" aria-hidden="true"></div>
        <div class="macbook-screen">
          <img src="assets/calc-desktop-zoom.png" alt="Calculateur de Prix & Rentabilité haute définition sur ordinateur" />
        </div>
      </div>
      <div class="macbook-base"><div class="macbook-notch" aria-hidden="true"></div></div>
    </div>

    <img
      class="L real-phone overlap-ok"
      src="assets/iphone-calc.png"
      alt="Calculateur de Prix & Rentabilité sur iPhone haute définition"
      style="left:744px; top:484px; width:282px"
    />

    <div class="L cta-bordeaux" style="left:280px; top:1158px; width:520px">
      <span>Découvrir la méthode</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </div>
  </div>
  <script src="../../carousels/check.js"></script>
</body>
</html>
