<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Ad Batch 03 • 02 Avant / Après Plateforme Bordeaux</title>
  <link rel="stylesheet" href="ads-bordeaux.css" />
  <style>
    .slide-02 {
      background: radial-gradient(circle at 55% 48%, #FAF5EE 0%, #EFE5DA 100%);
    }
    .ba-title {
      text-align: center;
      font-family: var(--sans);
      font-weight: 800;
      font-size: 58px;
      line-height: 1.08;
      letter-spacing: -0.025em;
      color: #171313;
    }
    .ba-serif {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 400;
      font-size: 70px;
      color: #B63131;
      letter-spacing: -0.015em;
    }
    .tag-wrap {
      text-align: center;
    }
    .tag-before {
      display: inline-block;
      background: #E8E1D9;
      color: #5C534E;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 28px;
      line-height: 1.1;
      padding: 10px 22px;
      border-radius: 999px;
    }
    .tag-after {
      display: inline-block;
      background: #FCE8E8;
      color: #9E2222;
      border: 1.5px solid rgba(182, 49, 49, 0.25);
      font-family: var(--mono);
      font-weight: 700;
      font-size: 28px;
      line-height: 1.1;
      padding: 10px 22px;
      border-radius: 999px;
    }
    .paper-shot {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      opacity: 0.88;
      filter: saturate(0.35);
      box-shadow: 0 24px 55px rgba(23, 19, 19, 0.14);
    }
    .center-arrow-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border-radius: 999px;
      box-shadow: 0 12px 26px rgba(182, 49, 49, 0.22);
    }
    .ba-cap-muted {
      text-align: center;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 600;
      color: #5C534E;
    }
    .ba-cap-strong {
      text-align: center;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 700;
      color: #171313;
    }
  </style>
</head>
<body>
  <div class="slide slide-02">
    <h1 class="L ba-title" style="left:60px; top:60px; width:960px">
      Ce que tes clients oublient<br />
      vs <span class="ba-serif">ce qu'ils gardent.</span>
    </h1>

    <div class="L tag-wrap" style="left:58px; top:252px; width:434px">
      <span class="tag-before">AVANT · PDF CLASSIQUE</span>
    </div>

    <div class="L" style="left:70px; top:344px; width:410px; transform:rotate(-2deg)">
      <img
        class="paper-shot"
        src="assets/pdf1-page1-portrait.png"
        alt="Document PDF classique figé"
      />
    </div>

    <p class="L ba-cap-muted" style="left:58px; top:974px; width:434px">
      Lu une fois, oublié aussitôt.
    </p>

    <div class="L connector overlap-ok center-arrow-circle" aria-hidden="true" style="left:500px; top:602px; width:80px; height:80px">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#B63131" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </div>

    <div class="L tag-wrap" style="left:552px; top:252px; width:472px">
      <span class="tag-after">APRÈS · PLATEFORME GUIDÉE</span>
    </div>

    <img
      class="L real-phone"
      src="assets/iphone-platform-hd.png"
      alt="Rendu haute définition de la plateforme AI CREATOR Studio sur iPhone"
      style="left:640px; top:332px; width:296px; transform:rotate(1.5deg)"
    />

    <p class="L ba-cap-strong" style="left:556px; top:974px; width:464px">
      7 leçons pas à pas, droit au but.
    </p>

    <div class="L cta-bordeaux" style="left:255px; top:1158px; width:570px">
      <span>Voir la méthode en action</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </div>
  </div>
  <script src="../../carousels/check.js"></script>
</body>
</html>
