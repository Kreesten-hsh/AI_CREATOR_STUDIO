<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Gabarit Slide Carrousel Studio Lin</title>
  <link rel="stylesheet" href="../carousel.css" />
</head>
<body>
  <!-- Une slide par fichier HTML. Chaque élément est un calque .L positionné (left, top, width). -->
  <div class="slide" data-theme="lin">
    <div class="L kicker" style="left:72px; top:84px; width:936px">CATÉGORIE • PILIER</div>
    <h1 class="L hook" style="left:72px; top:146px; width:936px">Titre court en <em class="hl">6 à 10 mots</em></h1>
    <div class="L card" style="left:72px; top:560px; width:936px">
      <p class="body">Une seule idée claire par slide, en 25 mots maximum, avec un bénéfice concret dès la lecture.</p>
    </div>

    <div class="L foot-progress">
      <span class="foot-handle">[TON_HANDLE_OU_AI_CREATOR_STUDIO]</span>
      <div class="foot-track"><div class="foot-fill" style="width:10%"></div></div>
      <span class="foot-count">1 sur 10</span>
    </div>
  </div>
  <script src="../check.js"></script>
</body>
</html>
