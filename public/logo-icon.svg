<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=JetBrains+Mono:wght@700&amp;family=Plus+Jakarta+Sans:wght@900&amp;display=swap');

      .font-sans-bold {
        font-family: 'Plus Jakarta Sans', 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
      }
      
      .font-serif-italic {
        font-family: 'Instrument Serif', 'Noto Serif Display', 'DejaVu Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
      }
      
      .font-tech {
        font-family: 'JetBrains Mono', 'Plus Jakarta Sans', Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Ombre franche néo-brutaliste -->
  <rect x="22" y="22" width="216" height="216" rx="28" fill="#171313" />

  <!-- Carte blanche de base (#FFFDFC) -->
  <rect x="14" y="14" width="216" height="216" rx="28" fill="#FFFDFC" stroke="#171313" stroke-width="6" />

  <!-- Monogramme AC au centre optique -->
  <text x="82" y="142" text-anchor="middle" class="font-sans-bold" font-size="118" fill="#171313">
    A
  </text>
  <text x="156" y="144" text-anchor="middle" class="font-serif-italic" font-size="138" fill="#B63131">
    c
  </text>

  <!-- Filet d'ancrage -->
  <rect x="54" y="176" width="136" height="5" rx="2.5" fill="#171313" />

  <!-- Signature STUDIO -->
  <text x="122" y="196" text-anchor="middle" class="font-tech" font-size="10" fill="#171313">
    STUDIO
  </text>
</svg>
