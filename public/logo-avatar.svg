<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;family=Plus+Jakarta+Sans:wght@900&amp;display=swap');

      .font-sans-bold {
        font-family: 'Plus Jakarta Sans', 'Liberation Sans', 'DejaVu Sans', Arial, sans-serif;
        font-weight: 900;
        text-transform: uppercase;
      }
      
      .font-serif-italic {
        font-family: 'Instrument Serif', 'Noto Serif Display', 'DejaVu Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
      }
      
      .font-tech {
        font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Fond plein rouge brique signature (#B63131) -->
  <rect width="1024" height="1024" fill="#B63131" />

  <!-- Monogramme AC centré optiquement pour recadrage rond Instagram/TikTok/Facebook -->
  <g transform="translate(512, 570)">
    <!-- 'A' Architectural Majuscule en Blanc Pur (#FFFDFC) -->
    <text x="-140" y="0" text-anchor="middle" class="font-sans-bold" font-size="360" fill="#FFFDFC">
      A
    </text>

    <!-- 'c' Majuscule / Initiale Serif Italique en Crème Papier (#FAF6F0) -->
    <text x="135" y="8" text-anchor="middle" class="font-serif-italic" font-size="420" fill="#FAF6F0">
      c
    </text>
  </g>

  <!-- Filet d'ancrage typographique franc en Blanc Pur -->
  <rect x="292" y="674" width="440" height="12" rx="6" fill="#FFFDFC" />

  <!-- Signature 'STUDIO' équilibrée -->
  <text x="512" y="744" text-anchor="middle" class="font-tech" font-size="42" fill="#FFFDFC" letter-spacing="6">
    S T U D I O
  </text>
</svg>
